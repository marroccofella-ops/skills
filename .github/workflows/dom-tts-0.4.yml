name: Dom TTS portable core
on:
  push:
    paths: ['dom-tts/**', '.github/workflows/dom-tts-0.4.yml']
  pull_request:
    paths: ['dom-tts/**', '.github/workflows/dom-tts-0.4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dom-tts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel, macos-14]
        node: [18, 20, 22, 24]
        include:
          - os: ubuntu-24.04-arm
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node tests/browser-build-check.cjs
      - run: node tests/browser-command-check.cjs
      - run: node tests/browser-diagnostics-check.cjs
      - run: node tests/browser-http-body-check.cjs
      - run: node tests/browser-migration-check.cjs
      - run: node tests/browser-owner-check.cjs
      - run: node tests/browser-player-check.cjs
      - run: node tests/browser-queue-check.cjs
      - run: node tests/browser-history-check.cjs
      - run: node tests/browser-recovery-check.cjs
      - run: node tests/browser-restart-check.cjs
      - run: node tests/browser-screen-check.cjs
      - run: node tests/browser-session-check.cjs
      - run: node tests/browser-speed-check.cjs
      - run: node tests/delta-narrator-check.cjs
      - run: node tests/markdown-progress-check.cjs
      - run: node tests/markdown-rich-check.cjs
      - run: node tests/reply-stream-check.cjs
      - run: node tests/source-reader-checks.cjs
      - run: node tests/segment-stream-checks.cjs
      - run: node tests/native-timeout-check.cjs
      - run: node tests/native-ipc-check.cjs
      - run: node tests/native-ipc-check.cjs --synchronous
      - run: node tests/native-ipc-check.cjs --late-progress
      - run: node tests/native-ipc-check.cjs --child-error
      - run: node tests/native-spawn-check.cjs
      - run: node tests/native-stop-send-check.cjs
      - run: node tests/native-stop-send-check.cjs --callback
      - run: node tests/native-lease-check.cjs
      - run: node tests/native-lease-check.cjs --normal
      - run: node tests/native-lease-check.cjs --startup
      - run: node tests/native-policy-check.cjs
      - run: node tests/native-heartbeat-check.cjs
      - run: node tests/native-heartbeat-check.cjs --nonzero
      - run: node tests/native-heartbeat-check.cjs --active-failure
      - run: node tests/native-heartbeat-check.cjs --late-progress
      - run: node tests/playback-abort-check.cjs
      - run: node tests/native-player-check.cjs
      - run: node tests/isolated-check-diagnostic.cjs
      - run: node tests/isolated-cleanup-check.cjs
      - run: node tests/isolated-player-check.cjs
      - run: node -e "require('./scripts/package').verify()"
      - run: node tests/install-check.cjs
      - run: node tests/native-boundary.cjs
      - if: runner.os == 'Windows'
        run: node tests/windows-privacy.cjs
      - name: Diagnose Windows permission helper after failure
        if: failure() && runner.os == 'Windows'
        run: node tests/windows-permission-probe.cjs
